<title>Atomeric — Coming Soon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  background:#050814;
  overflow:hidden;
  color:#fff;
}

/* ── Entrance animations ─────────────────────────────────────────── */
@keyframes heroReveal{
  from{opacity:0;transform:translateY(28px);filter:blur(12px)}
  to  {opacity:1;transform:translateY(0);filter:blur(0)}
}
@keyframes heroFade{
  from{opacity:0;transform:translateY(20px)}
  to  {opacity:1;transform:translateY(0)}
}
@keyframes heroZoom{
  from{transform:scale(1.08)}
  to  {transform:scale(1)}
}
@keyframes navFade{
  from{opacity:0;transform:translateY(-10px)}
  to  {opacity:1;transform:translateY(0)}
}
@keyframes pulseDot{
  0%,100%{opacity:.5;transform:scale(1)}
  50%    {opacity:1;transform:scale(1.08)}
}

.ha{opacity:0;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(0.16,1,0.3,1)}
.hr{animation-name:heroReveal;animation-duration:1.1s}
.hf{animation-name:heroFade;animation-duration:1s}

/* ── Background layer: base (always visible) ─────────────────────── */
.base-layer{
  background:#050814;
  background-image:
    radial-gradient(ellipse 55% 65% at 18% 62%,rgba(7,20,60,.85) 0%,transparent 65%),
    radial-gradient(ellipse 40% 50% at 80% 30%,rgba(7,10,40,.6)  0%,transparent 60%),
    radial-gradient(circle,rgba(255,255,255,.032) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,28px 28px;
}

/* ── Background layer: reveal (teal, unmasked by cursor) ─────────── */
.reveal-layer{
  background:#051218;
  background-image:
    radial-gradient(ellipse 65% 75% at 68% 36%,rgba(13,191,173,.7) 0%,rgba(7,100,110,.3) 40%,transparent 68%),
    radial-gradient(ellipse 50% 55% at 28% 72%,rgba(7,60,80,.5)   0%,transparent 58%),
    radial-gradient(circle,rgba(110,231,224,.16) 1px,transparent 1px),
    linear-gradient(135deg,rgba(13,191,173,.05) 0%,transparent 50%);
  background-size:100% 100%,100% 100%,28px 28px,100% 100%;

  /* mask starts fully hidden; JS updates it on mousemove */
  -webkit-mask-image:radial-gradient(circle 280px at -999px -999px,rgba(255,255,255,1) 35%,rgba(255,255,255,.6) 60%,rgba(255,255,255,0) 100%);
  mask-image:       radial-gradient(circle 280px at -999px -999px,rgba(255,255,255,1) 35%,rgba(255,255,255,.6) 60%,rgba(255,255,255,0) 100%);
}

/* ── Shared absolute-fill helper ──────────────────────────────────── */
.fill{position:absolute;inset:0}

/* ── Nav ──────────────────────────────────────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;padding:20px 28px;
  animation:navFade .8s cubic-bezier(0.16,1,0.3,1) forwards;
}
.logo-name{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;
  font-size:22px;
  letter-spacing:-.02em;
  color:#fff;
}

/* ── Pill / badge ─────────────────────────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:8px;
  border-radius:100px;
  background:rgba(13,191,173,.16);
  border:1px solid rgba(13,191,173,.38);
}
.pill-sm{padding:5px 14px}
.pill-md{padding:10px 24px;margin-top:8px}
.pill-label{color:#6EE7E0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.pill-label-lg{color:rgba(255,255,255,.9);font-size:15px;font-weight:500;letter-spacing:.06em}
.pulse-dot{
  width:8px;height:8px;border-radius:50%;
  background:#0DBFAD;
  animation:pulseDot 2s ease-in-out infinite;
}

/* ── Hero ─────────────────────────────────────────────────────────── */
.hero{position:relative;width:100%;height:100dvh;overflow:hidden;background:#050814}

/* ── Input + button ──────────────────────────────────────────────── */
.email-input{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:13px 16px;
  color:#fff;
  font-size:14px;
  font-family:inherit;
  outline:none;
  width:100%;
  transition:border-color .2s;
  caret-color:#0DBFAD;
}
.email-input::placeholder{color:rgba(255,255,255,.32)}
.email-input:focus{border-color:rgba(13,191,173,.5)}

.submit-btn{
  background:#0DBFAD;
  color:#020D15;
  font-size:14px;font-weight:600;
  padding:13px 28px;
  border-radius:100px;border:none;cursor:pointer;
  font-family:inherit;letter-spacing:-.01em;
  width:100%;
  transition:background .2s,transform .12s;
}
.submit-btn:hover{background:#6EE7E0}
.submit-btn:active{transform:scale(.98)}
.submit-btn:focus-visible{outline:2px solid #6EE7E0;outline-offset:2px}

/* ── Success box ──────────────────────────────────────────────────── */
.success-box{
  display:flex;align-items:center;gap:10px;
  background:rgba(13,191,173,.14);
  border:1px solid rgba(13,191,173,.3);
  border-radius:12px;padding:16px;
}
.check-ring{
  width:20px;height:20px;border-radius:50%;
  background:#0DBFAD;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.success-box p{color:rgba(255,255,255,.9);font-size:13px;font-weight:500;line-height:1.4}

/* ── Reduced motion ───────────────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  .ha,.hz,.nav-anim{animation:none!important;opacity:1!important;filter:none!important}
  .pulse-dot{animation:none}
}

/* ── Mobile ───────────────────────────────────────────────────────── */
@media(max-width:600px){
  body{overflow:auto}
  .hero{height:auto;min-height:100dvh;padding-bottom:2rem}
  .desc-block{display:none}
  .form-block{
    right:16px!important;left:16px!important;
    bottom:24px!important;width:auto!important;
  }
  .cursor-hint{display:none}
}
</style>

<!-- ── Nav ──────────────────────────────────────────────────────────── -->
<nav>
  <span class="logo-name">atomeric</span>
</nav>

<!-- ── Hero ──────────────────────────────────────────────────────────── -->
<section class="hero">

  <!-- Base layer — always on -->
  <div class="fill base-layer" style="z-index:10;animation:heroZoom 2.2s cubic-bezier(0.16,1,0.3,1) forwards"></div>

  <!-- Reveal layer — teal, shown only through cursor spotlight -->
  <div id="revealLayer" class="fill reveal-layer" style="z-index:30;pointer-events:none"></div>

  <!-- Vignette -->
  <div class="fill" style="z-index:40;pointer-events:none;background:radial-gradient(ellipse 90% 80% at 50% 50%,transparent 40%,rgba(3,5,14,.55) 100%)"></div>

  <!-- ── Center heading ── -->
  <div style="position:absolute;top:14%;left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px;pointer-events:none;gap:16px">

    <div class="pill pill-sm ha hf" style="animation-delay:.1s">
      <span class="pill-label">The intelligence layer.</span>
    </div>

    <h1 style="color:#fff;line-height:.92;letter-spacing:-.04em">
      <span class="ha hr" style="display:block;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:clamp(40px,7vw,96px);animation-delay:.28s;letter-spacing:-.04em">
        The next generation of
      </span>
      <span class="ha hr" style="display:block;font-weight:700;font-size:clamp(40px,7vw,96px);animation-delay:.44s;letter-spacing:-.06em">
        business growth starts here.
      </span>
    </h1>

    <div class="pill pill-md ha hf" style="animation-delay:.58s">
      <div class="pulse-dot"></div>
      <span class="pill-label-lg">Launching Soon.</span>
    </div>

  </div>

  <!-- ── Bottom-left: descriptor ── -->
  <div class="desc-block ha hf" style="position:absolute;bottom:56px;left:40px;z-index:50;max-width:260px;animation-delay:.72s">
    <p style="font-size:13px;color:rgba(255,255,255,.62);line-height:1.72;font-weight:400">
      Not another agency.<br>
      <span style="color:rgba(255,255,255,.42)">The AI-led growth and transformation partner.</span>
    </p>
  </div>

  <!-- ── Bottom-right: waitlist form ── -->
  <div class="form-block ha hf" style="position:absolute;bottom:40px;right:40px;z-index:50;width:284px;animation-delay:.88s;display:flex;flex-direction:column;gap:14px">
    <form id="frm" novalidate style="display:flex;flex-direction:column;gap:10px">
      <label for="em" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Email address</label>
      <input type="email" id="em" class="email-input" placeholder="your@company.com" required autocomplete="email" inputmode="email">
      <button type="submit" class="submit-btn">Join the Waitlist</button>
    </form>
    <div id="ok" style="display:none">
      <div class="success-box">
        <div class="check-ring">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true">
            <path d="M1 4L3.8 7L9 1" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p>You're on the list — we'll reach out soon.</p>
      </div>
    </div>
  </div>


</section>

<script>
(function(){
  var R = 280;
  var mouse  = { x: -999, y: -999 };
  var smooth = { x: -999, y: -999 };
  var reveal = document.getElementById('revealLayer');

  function setMask(x, y) {
    var m = 'radial-gradient(circle ' + R + 'px at ' + x + 'px ' + y + 'px,' +
            'rgba(255,255,255,1) 0%,' +
            'rgba(255,255,255,1) 35%,' +
            'rgba(255,255,255,.72) 55%,' +
            'rgba(255,255,255,.35) 72%,' +
            'rgba(255,255,255,.1)  86%,' +
            'rgba(255,255,255,0)   100%)';
    reveal.style.webkitMaskImage = m;
    reveal.style.maskImage = m;
  }

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    mouse.x = t.clientX;
    mouse.y = t.clientY;
  }, { passive: true });

  (function tick(){
    smooth.x += (mouse.x - smooth.x) * 0.1;
    smooth.y += (mouse.y - smooth.y) * 0.1;
    setMask(smooth.x, smooth.y);
    requestAnimationFrame(tick);
  })();

  // Form
  document.getElementById('frm').addEventListener('submit', function(e){
    e.preventDefault();
    var v = document.getElementById('em').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){
      document.getElementById('em').focus();
      return;
    }
    this.style.display = 'none';
    document.getElementById('ok').style.display = 'block';
  });
})();
</script>
